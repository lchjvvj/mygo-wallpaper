name: build

on:
  push:
    branches: [ master, main]
  pull_request:
  workflow_dispatch:

env:
  DEB_BUILD_OPTIONS: "parallel=4"
  PACKAGE_NAME: mygo-wallpaper
  GO_VERSION: "1.27.3"
  LIBLCL_AMD64_URL: "https://github.com/ying32/govcl/releases/download/v2.2.3/liblcl-2.2.3.zip"
  LIBLCL_ARM64_URL: "https://gitee.com/energye/liblcl/releases/download/v2.2.5/liblcl.LinuxARM64GTK2.zip"

jobs:
  build_deb_amd64:
    runs-on: ubuntu-26.04
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt update -y
          apt install -y --no-install-recommends \
            debhelper-compat \
            build-essential \
            dpkg-dev \
            devscripts \
            lintian \
            curl \
            git \
            unzip \
            ca-certificates
      - name: Install Go toolchain
        run: |
          arch="$(dpkg --print-architecture)"
          curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-${arch}.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm -f /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download liblcl runtime
        run: |
          arch="$(dpkg --print-architecture)"
          if [ "$arch" = "arm64" ]; then
            url="${LIBLCL_ARM64_URL}"
            member="liblcl.so"
          else
            url="${LIBLCL_AMD64_URL}"
            member="linux64-gtk2/liblcl.so"
          fi
          curl -fsSL -o /tmp/liblcl.zip "$url"
          unzip -j -o /tmp/liblcl.zip "$member" -d .
          rm -f /tmp/liblcl.zip
          test -s liblcl.so
      - name: Build deb package
        run: |
          go version
          go mod tidy
          dpkg-buildpackage -us -uc -b
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../${PACKAGE_NAME}_*.deb ../${PACKAGE_NAME}_*.buildinfo ../${PACKAGE_NAME}_*.changes dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/
          retention-days: 7

  build_deb_arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt update -y
          apt install -y --no-install-recommends \
            debhelper-compat \
            build-essential \
            dpkg-dev \
            devscripts \
            lintian \
            curl \
            git \
            unzip \
            ca-certificates
      - name: Install Go toolchain
        run: |
          arch="$(dpkg --print-architecture)"
          curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-${arch}.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm -f /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download liblcl runtime
        run: |
          arch="$(dpkg --print-architecture)"
          if [ "$arch" = "arm64" ]; then
            url="${LIBLCL_ARM64_URL}"
            member="liblcl.so"
          else
            url="${LIBLCL_AMD64_URL}"
            member="linux64-gtk2/liblcl.so"
          fi
          curl -fsSL -o /tmp/liblcl.zip "$url"
          unzip -j -o /tmp/liblcl.zip "$member" -d .
          rm -f /tmp/liblcl.zip
          test -s liblcl.so
      - name: Build deb package
        run: |
          go version
          go mod tidy
          dpkg-buildpackage -us -uc -b
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../${PACKAGE_NAME}_*.deb ../${PACKAGE_NAME}_*.buildinfo ../${PACKAGE_NAME}_*.changes dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/
          retention-days: 7
  archive:
    runs-on: ubuntu-26.04
    needs:
      - build_deb_amd64
      - build_deb_arm64
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
      - name: Archive
        run: |
          zip -r ${PACKAGE_NAME}-ci-artifacts.zip out/
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ${{ env.PACKAGE_NAME }}-ci-artifacts.zip
          retention-days: 30
